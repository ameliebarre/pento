services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa_dev
    ports:
      - "5435:5432"
    volumes:
      - medusa_db_data:/var/lib/postgresql/data

volumes:
  medusa_db_data:
